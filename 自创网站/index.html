<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星际探索</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="universe">
    <div class="nebula"></div>
    <div class="planet"></div>
    <div class="moon"></div>
    <div class="ship">
      <div class="ship-body"></div>
      <div class="ship-window"></div>
      <div class="ship-tail"></div>
    </div>
    <div class="content">
      <h1>星际探索</h1>
      <p>欢迎来到星际之旅。在这里，你可以穿越星云，发现未知，追逐光年之外的梦想。</p>
      <a class="btn" href="#about">开始探索</a>
    </div>
  </div>
  <section id="about" class="info-panel">
    <h2>关于这个网站</h2>
    <p>这是一个星际主题展示页面，采用纯 HTML、CSS 和少量 JavaScript，实现星空背景、星云动画和飞船运动效果。</p>
    <ul>
      <li>动态星空背景</li>
      <li>渐变星云效果</li>
      <li>飞船巡航动画</li>
    </ul>
  </section>
  <script src="script.js"></script>
</body>
</html>
